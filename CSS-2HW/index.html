<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Resume</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
        color: #222;
        background-color: #fafafa;
    }

    /* ---------- Fixed navigation bar ---------- */
    header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background-color: #2c3e50;
        z-index: 1000;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    nav {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        padding: 15px 10px;
    }

    nav a {
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
        font-size: 15px;
        padding: 8px 14px;
        border-radius: 4px;
        transition: background-color 0.2s ease-in-out;
    }

    nav a:hover {
        background-color: #34495e;
    }

    /* ---------- Layout ---------- */
    main {
        margin-top: 64px; /* compensate for fixed header height */
        max-width: 900px;
        padding: 20px;
        margin-left: auto;
        margin-right: auto;
    }

    section {
        min-height: 60vh;
        padding: 50px 0;
        border-bottom: 1px solid #ddd;
    }

    section:last-of-type {
        border-bottom: none;
    }

    section h2 {
        font-size: 28px;
        margin-bottom: 20px;
        color: #2c3e50;
        border-left: 5px solid #2c3e50;
        padding-left: 12px;
    }

    section p {
        font-size: 16px;
        color: #444;
        margin-bottom: 12px;
    }

    /* ---------- About section (photo + text) ---------- */
    .about-content {
        display: flex;
        flex-wrap: wrap;
        gap: 25px;
        align-items: center;
    }

    .about-content img {
        width: 180px;
        height: 180px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid #2c3e50;
    }

    .about-text {
        flex: 1;
        min-width: 250px;
    }

    /* ---------- Skills grid with icons ---------- */
    .skills-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }

    .skill-card {
        background: #fff;
        border-radius: 8px;
        padding: 15px;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .skill-card img {
        width: 60px;
        height: 60px;
        margin-bottom: 10px;
    }

    /* ---------- Projects/experience gallery ---------- */
    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }

    .gallery figure {
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .gallery img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        display: block;
    }

    .gallery figcaption {
        padding: 10px;
        font-size: 14px;
        color: #444;
    }

    /* ---------- Hobbies ---------- */
    .hobbies-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }

    .hobbies-grid img {
        width: 100%;
        height: 130px;
        object-fit: cover;
        border-radius: 8px;
    }

    /* ---------- Contact ---------- */
    .contact-list {
        list-style: none;
        margin-top: 15px;
    }

    .contact-list li {
        margin-bottom: 10px;
        font-size: 16px;
    }

    .contact-list a {
        color: #2c3e50;
        text-decoration: none;
        font-weight: bold;
    }

    .contact-list a:hover {
        text-decoration: underline;
    }

    /* ---------- Footer (always at the bottom, NOT fixed) ---------- */
    footer {
        background-color: #2c3e50;
        color: #fff;
        text-align: center;
        padding: 25px 15px;
    }

    footer p {
        font-size: 14px;
        margin: 4px 0;
    }

    footer a {
        color: #ffffff;
    }
</style>
</head>
